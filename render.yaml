services:
  - type: web
    name: pitwall-studio
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - fromGroup: pitwall-secrets
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pitwall-db
          property: connectionString
      - key: MAX_JOBS_PER_DAY
        value: '30'
databases:
  - name: pitwall-db
    plan: free
    region: oregon
    databaseName: pitwall
    user: pitwall
    ipAllowList: []
